<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Comment Filter</title><link rel="stylesheet" href="popup.css"></head><body><main><header><div><h1>YouTube Comment Filter</h1><p>Hide noise without deleting anything.</p></div><label class="switch-row compact"><span>Enabled</span><input id="enabled" type="checkbox"></label></header><section><label>Blocked keywords<textarea id="blockedKeywords" rows="4" placeholder="crypto&#10;telegram&#10;giveaway"></textarea><small>One keyword or phrase per line.</small></label><label>Blocked users<textarea id="blockedUsers" rows="3" placeholder="@username&#10;channel name"></textarea><small>One username/channel per line.</small></label></section><section class="toggles"><label class="switch-row"><span><strong>Hide comments with links</strong><small>Filters obvious URLs and domains.</small></span><input id="hideLinks" type="checkbox"></label><label class="switch-row"><span><strong>Hide emoji spam</strong><small>Filters comments dominated by repeated emoji.</small></span><input id="hideEmojiSpam" type="checkbox"></label><label class="switch-row"><span><strong>Hide repeated spam</strong><small>Filters long repeated characters/groups.</small></span><input id="hideRepeatedSpam" type="checkbox"></label><label class="switch-row"><span><strong>Hide all replies</strong><small>Keeps only top-level discussion.</small></span><input id="hideReplies" type="checkbox"></label><label class="switch-row"><span><strong>Show hidden placeholder</strong><small>Lets you reveal a filtered comment manually.</small></span><input id="showPlaceholder" type="checkbox"></label><label class="switch-row"><span><strong>Hide very short comments</strong><small>Optional minimum character rule.</small></span><input id="hideVeryShort" type="checkbox"></label><label class="number-row">Minimum length<input id="minLength" type="number" min="1" max="100" value="3"></label></section><div class="actions"><button id="spamPreset" class="primary">Spam preset</button><button id="reset">Reset</button></div><p id="status">Settings save automatically.</p></main><script src="popup.js"></script></body></html>
